[package]
name = "any-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4.6.2", features = ["derive"] }
futures-util = "0.3.32"
ratatui = "0.30.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "charset"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
unicode-width = "0.2.2"
